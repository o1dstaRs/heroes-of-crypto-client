<!-- game/core/src/ui/index.html -->
<!doctype html>
<html lang="en">
    <head>
        <!-- Favicon: served from vite's publicDir (game/core/public/favicon.ico). The old relative
             ../../images/ path escaped the vite root (src/ui), so in dev the browser resolved it to
             /images/favicon.ico — answered by the SPA fallback with HTML, never an icon. -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <!-- The display face is also consumed by Pixi/canvas, where a late font swap cannot repaint text
             automatically. Preload it before either renderer creates its first carved heading. -->
        <link
            rel="preload"
            href="/fonts/hoc-forge/HoCForge-Regular.ttf"
            as="font"
            type="font/ttf"
            crossorigin="anonymous"
        />
        <!-- Google Identity Services is requested HERE, at parse time, instead of when the sign-in
             component mounts. The client boots a full Pixi scene and its atlases first, so waiting for
             that React effect left the sign-in button ~20s behind a cold load — on production as well as
             staging. loadGoogleIdentityServices() looks for this exact tag and reuses it rather than
             injecting a second one, and resolves immediately if it has already finished. -->
        <link rel="preconnect" href="https://accounts.google.com" crossorigin />
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <meta charset="UTF-8" />
        <!-- viewport-fit=cover: without it a notched Mac in fullscreen lays the page out BELOW the
             camera housing and leaves a black band across the top. Opting in lets the viewport run
             edge to edge; the notch then simply covers whatever is behind it, which is what we want
             here — the board is centred and has nothing to lose up there. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Play Heroes of Crypto</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./index.tsx"></script>
    </body>
</html>
