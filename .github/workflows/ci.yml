name: Client CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Init common submodule (HTTPS)
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Check image asset locations
              run: bun run check:images

            - name: Test game image asset policy
              run: bun test --cwd game/core src/gameImageAssetPolicy.test.ts

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Init common submodule (HTTPS)
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build common types
              working-directory: game/heroes-of-crypto-common
              run: bunx tsc --project tsconfig.build.json

            - name: Generate core asset stubs
              run: bun run --cwd game/core scripts/generate_ci_stubs.js

            - name: Typecheck core
              run: bunx tsc --noEmit -p game/core/tsconfig.json

    core:
        name: Core tests and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Init common submodule (HTTPS)
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build common types
              working-directory: game/heroes-of-crypto-common
              run: bunx tsc --project tsconfig.build.json

            - name: Generate core asset stubs
              run: bun run --cwd game/core scripts/generate_ci_stubs.js

            - name: Run core tests
              run: bun run test:core

            - name: Build core
              run: bun run --cwd game/core build:skip

    common-tests:
        name: Common tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Init common submodule (HTTPS)
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Run common tests
              run: bun run --cwd game/heroes-of-crypto-common test

    site:
        name: Site build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Init common submodule (HTTPS)
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build site
              run: bun run --cwd site build

            - name: Check output
              run: |
                  test -f site/dist/index.html
                  test -f site/dist/game/index.html
                  test -f site/dist/knowledge-base/index.html
                  test -f site/dist/ru/knowledge-base/index.html
                  test -f site/dist/rules/index.html
                  grep -Fq '/knowledge-base/#rules' site/dist/rules/index.html
                  grep -Fq '<loc>https://heroesofcrypto.io/knowledge-base/</loc>' site/dist/sitemap-0.xml
                  grep -Fq '<loc>https://heroesofcrypto.io/ru/knowledge-base/</loc>' site/dist/sitemap-0.xml
                  for section in rules units abilities spells artifacts; do
                      ! grep -Fq "<loc>https://heroesofcrypto.io/${section}/</loc>" site/dist/sitemap-0.xml
                      ! grep -Fq "<loc>https://heroesofcrypto.io/ru/${section}/</loc>" site/dist/sitemap-0.xml
                  done
                  echo "Site build checks passed."
