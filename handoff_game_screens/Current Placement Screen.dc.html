<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;secondsRemaining&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:132,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:300,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Placement&quot;},&quot;secondsMax&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:180,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:30,&quot;max&quot;:300,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Placement&quot;}}">
class Component extends DCLogic {
  state = { left: this.props.secondsRemaining ?? 132 };
  componentDidMount() {
    this.t = setInterval(() => this.setState(s => ({ left: s.left > 0 ? s.left - 1 : 0 })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const max = this.props.secondsMax ?? 180;
    const l = this.state.left;
    const critical = l > 0 && l <= 5;
    return {
      autoStartLine: l > 0 ? l + 's until auto-start' : 'Starting fight.',
      progressPct: Math.max(0, Math.min(100, 100 - (l / max) * 100)) + '%',
      timerPct: Math.max(0, Math.min(100, (l / max) * 100)) + '%',
      secondsLabel: l + 's',
      secondsColor: critical ? '#ff5a3f' : '#efe4cc'
    };
  }
}
</script>
