<script type="text/x-dc" data-dc-script data-props="{&quot;turnSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:45,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:120,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Draft&quot;}}">
const ART_IMG = {
  "Warlord's Edge": 'assets/artifact_t2_warlords_edge_256.webp',
  'Titan Plate': 'assets/artifact_t2_titan_plate_256.webp',
  'Clover of Fortune': 'assets/artifact_t2_clover_of_fortune_256.webp'
};
class Component extends DCLogic {
  state = { left: this.props.turnSeconds ?? 45, picked: null, confirmed: null };
  componentDidMount() {
    this.t = setInterval(() => this.setState(s => ({ left: s.left > 0 ? s.left - 1 : 0 })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  fillSlot(name) {
    const slot = document.getElementById('t2slot');
    if (!slot) return;
    slot.style.animation = 'none';
    slot.style.borderStyle = 'solid';
    slot.style.borderColor = '#dcb158';
    slot.style.background = '#12151d';
    slot.innerHTML = '<img src="' + ART_IMG[name] + '" alt="' + name + '" style="width:100%;height:100%;object-fit:contain;display:block">';
  }
  renderVals() {
    const l = this.state.left;
    const locked = !!this.state.confirmed;
    return {
      clockColor: l < 15 ? '#ff3b2f' : 'inherit',
      clockGlow: l < 15 ? '0 0 18px rgba(255,59,47,.75)' : 'none',
      clock: Math.floor(l / 60) + ':' + String(l % 60).padStart(2, '0'),
      confirmLabel: locked ? this.state.confirmed + ' locked in' : (this.state.picked ? 'Confirm ' + this.state.picked : 'Pick an artifact'),
      pick: (e) => {
        if (locked) return;
        const card = e.target.closest('[data-artifact]');
        if (!card) return;
        card.parentNode.querySelectorAll('[data-artifact]').forEach(c => {
          c.style.borderColor = 'rgba(255,255,255,.12)';
          c.style.boxShadow = 'none';
          c.style.background = '#12151d';
        });
        card.style.borderColor = '#dcb158';
        card.style.boxShadow = '0 0 40px rgba(220,177,88,.28)';
        card.style.background = '#171a23';
        this.setState({ picked: card.dataset.artifact });
      },
      confirm: () => {
        if (!this.state.picked || locked) return;
        this.fillSlot(this.state.picked);
        this.setState({ confirmed: this.state.picked });
      }
    };
  }
}
</script>
