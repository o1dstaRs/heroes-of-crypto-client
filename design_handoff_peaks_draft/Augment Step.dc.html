<script type="text/x-dc" data-dc-script data-props="{&quot;turnSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:180,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Draft&quot;},&quot;budget&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:5,&quot;max&quot;:7,&quot;unit&quot;:&quot;pts&quot;,&quot;section&quot;:&quot;Draft&quot;}}">
class Component extends DCLogic {
  state = { left: this.props.turnSeconds ?? 60, spent: { Placement: 0, Armor: 0, Might: 0, Magic: 0, MagicDefense: 0, Sniper: 0, Movement: 0 }, confirmed: false };
  componentDidMount() {
    this.t = setInterval(() => this.setState(s => ({ left: s.left > 0 ? s.left - 1 : 0 })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const l = this.state.left;
    const budget = this.props.budget ?? 7;
    const used = Object.values(this.state.spent).reduce((a, b) => a + b, 0);
    const remaining = budget - used;
    return {
      clock: Math.floor(l / 60) + ':' + String(l % 60).padStart(2, '0'),
      clockColor: l < 15 ? '#ff3b2f' : 'inherit',
      clockGlow: l < 15 ? '0 0 18px rgba(255,59,47,.75)' : 'none',
      remaining: remaining + ' / ' + budget,
      btnBg: remaining > 0 ? 'linear-gradient(180deg, #d9a94f 0%, #b2823a 46%, #7d5a24 100%)' : 'linear-gradient(180deg, #7ab86a 0%, #4e9450 46%, #2f6b3c 100%)',
      btnEdge: remaining > 0 ? 'rgba(255,236,190,.5)' : 'rgba(214,240,200,.55)',
      confirmLabel: this.state.confirmed ? 'Ready' : 'Continue to placement',
      pick: (e) => {
        const btn = e.target.closest('[data-aug]');
        if (!btn) return;
        const key = btn.dataset.aug;
        const cost = Number(btn.dataset.cost);
        const others = used - this.state.spent[key];
        if (others + cost > budget) return;
        btn.parentNode.querySelectorAll('[data-aug]').forEach(b => {
          b.style.borderColor = 'rgba(255,255,255,.12)';
          b.style.background = 'rgba(255,255,255,.03)';
          b.style.color = '#c8ccd4';
        });
        btn.style.borderColor = '#dcb158';
        btn.style.background = 'rgba(220,177,88,.14)';
        btn.style.color = '#efe4cc';
        this.setState(s => ({ spent: Object.assign({}, s.spent, { [key]: cost }), confirmed: false }));
      },
      pickSyn: (e) => {
        const btn = e.target.closest('[data-syn]');
        if (!btn) return;
        btn.parentNode.querySelectorAll('[data-syn]').forEach(b => {
          b.style.borderColor = 'rgba(255,255,255,.12)';
          b.style.background = 'rgba(255,255,255,.03)';
          b.querySelector('span').style.color = '#c8ccd4';
        });
        btn.style.borderColor = '#3b9b5c';
        btn.style.background = 'rgba(59,155,92,.16)';
        btn.querySelector('span').style.color = '#8ff0b4';
      },
      confirm: () => this.setState({ confirmed: true })
    };
  }
}

</script>
