    <button onClick="{{ confirm }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:36px;padding:0 84px;min-height:132px;min-width:min(760px, 92%);border-radius:16px;background:{{ btnBg }};box-shadow:inset 0 0 0 3px {{ btnEdge }}, inset 0 2px 0 rgba(255,255,255,.35), inset 0 -12px 26px rgba(0,0,0,.28);color:#fff;font-family:var(--font-body);font-size:46px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:hocBlink 1.4s ease-in-out infinite" style-hover="filter:brightness(1.12);animation:none" style-active="filter:brightness(.9)">
      <span>{{ confirmLabel }}</span>
      <span style="display:flex;align-items:center;padding-left:36px;border-left:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums;min-width:130px;justify-content:center;color:{{ clockColor }};text-shadow:{{ clockGlow }}">{{ clock }}</span>

  <div style="margin-top:auto;display:flex;align-items:flex-start;gap:6px;padding:14px 22px;border-radius:24px;background:#12151d;border:2px solid rgba(255,255,255,.1)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto">

<script type="text/x-dc" data-dc-script data-props="{&quot;turnSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:58,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:120,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Draft&quot;},&quot;opponentTurn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Draft&quot;}}">
const CREATURES = {
  "Tsar Cannon": ["Life", 200, 45, 30, 3, 3.2],
  "Angel": ["Life", 180, 32, 28, 7.7, 8.8],
  "Champion": ["Life", 150, 25, 25, 5.9, 5.2],
  "Faerie Dragon": ["Nature", 160, 17, 24, 5, 5.5],
  "Gargantuan": ["Nature", 170, 29, 28, 4, 4.5],
  "Arachna Queen": ["Nature", 180, 32, 31, 5.4, 6.3],
  "Black Dragon": ["Chaos", 300, 48, 40, 9, 8],
  "Hydra": ["Chaos", 190, 33, 34, 6.2, 6.1],
  "Abomination": ["Chaos", 550, 20, 45, 3.3, 4.2],
  "Thunderbird": ["Might", 132, 33, 25, 8.5, 8],
  "Behemoth": ["Might", 180, 32, 28, 5.5, 4.2],
  "Frenzied Boar": ["Might", 240, 41, 42, 6.5, 7],
  "Squire": ["Life", 9, 8, 12, 4, 3.1, 1],
  "Scavenger": ["Chaos", 9, 9, 9, 7, 4.3, 1],
  "Hyena": ["Might", 26, 22, 19, 4, 4.3, 2],
  "White Tiger": ["Nature", 26, 20, 19, 5.8, 4.6, 2],
  "Wolf Rider": ["Might", 13, 12, 10, 7, 3.9, 1],
  "Unicorn": ["Nature", 70, 20, 23, 6, 4.5, 3]
};

class Component extends DCLogic {
  state = { left: this.props.turnSeconds ?? 58, picked: null, confirmed: null };
  componentDidMount() {
    this.t = setInterval(() => this.setState(s => ({ left: s.left > 0 ? s.left - 1 : 0 })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const l = this.state.left;
    const opp = this.props.opponentTurn ?? false;
    return {
      btnBg: opp ? 'linear-gradient(180deg, #d1554a 0%, #a3322b 46%, #6e1f1a 100%)' : 'linear-gradient(180deg, #7ab86a 0%, #4e9450 46%, #2f6b3c 100%)',
      btnEdge: opp ? 'rgba(255,205,195,.5)' : 'rgba(214,240,200,.55)',
      clock: Math.floor(l / 60) + ':' + String(l % 60).padStart(2, '0'),
      clockColor: l < 15 ? '#ff3b2f' : 'inherit',
      clockGlow: l < 15 ? '0 0 18px rgba(255,59,47,.75)' : 'none',
      confirmLabel: opp ? "Opponent's turn" : (this.state.confirmed ? this.state.confirmed + ' confirmed' : (this.state.picked ? 'Confirm ' + this.state.picked : 'Pick a creature')),
      pick: (e) => {
        if (this.props.opponentTurn) return;
        const btn = e.target.closest('[data-creature]');
        if (!btn || btn.dataset.locked) return;
        const grid = btn.closest('#creature-grid');
        grid.querySelectorAll('button[data-creature]:not([data-locked]) > div').forEach(f => {
          f.style.borderColor = 'rgba(255,255,255,.18)';
          f.style.boxShadow = 'none';
        });
        const frame = btn.querySelector('div');
        frame.style.borderColor = '#dcb158';
        frame.style.boxShadow = '0 0 22px rgba(220,177,88,.55)';
        this.setState({ picked: btn.dataset.creature, confirmed: null });
      },
      hoverIn: (e) => {
        const btn = e.target.closest('[data-creature]');
        if (!btn) return;
        const name = btn.dataset.creature;
        const c = CREATURES[name];
        if (!c) return;
        const p = document.getElementById('statpanel');
        const set = (k, v) => { const el = p.querySelector('[data-slot="' + k + '"]'); if (el) el.textContent = v; };
        const artEl = p.querySelector('[data-slot="art"]');
        artEl.src = 'assets/' + name.toLowerCase().replace(/ /g, '_') + '_128.webp';
        artEl.onerror = () => { artEl.style.visibility = 'hidden'; };
        artEl.onload = () => { artEl.style.visibility = 'visible'; };
        set('name', name);
        set('sub', 'Level ' + (c[6] || 4) + ' · ' + c[0]);
        set('hp', c[1] + '/' + c[1]);
        set('atk', c[2]);
        set('arm', c[3]);
        set('spd', c[4]);
        set('stp', c[5]);
        set('siz', (c[6] || 4) === 4 ? '2×2' : '1×1');
        p.style.display = 'flex';
      },
      hoverOut: (e) => {
        const btn = e.target.closest('[data-creature]');
        if (!btn || (e.relatedTarget && btn.contains(e.relatedTarget))) return;
        document.getElementById('statpanel').style.display = 'none';
      },
      confirm: () => { if (this.state.picked) this.setState({ confirmed: this.state.picked }); }
    };
  }
}

</script>
